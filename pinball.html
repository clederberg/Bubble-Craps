<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bubble Craps · Pinball Classic</title>
<meta name="description" content="Old-school three-reel slot with bars, bells and sevens, and a pinball drop bonus.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Cdefs%3E%3ClinearGradient%20id%3D%27g%27%20x1%3D%270%27%20y1%3D%270%27%20x2%3D%270%27%20y2%3D%271%27%3E%3Cstop%20offset%3D%270%27%20stop-color%3D%27%23fbe9a6%27%2F%3E%3Cstop%20offset%3D%271%27%20stop-color%3D%27%23c9962b%27%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Ccircle%20cx%3D%2732%27%20cy%3D%2732%27%20r%3D%2730%27%20fill%3D%27%230b1f17%27%20stroke%3D%27url%28%23g%29%27%20stroke-width%3D%274%27%2F%3E%3Ccircle%20cx%3D%2732%27%20cy%3D%2732%27%20r%3D%2723%27%20fill%3D%27none%27%20stroke%3D%27url%28%23g%29%27%20stroke-width%3D%275%27%20stroke-dasharray%3D%277%207%27%2F%3E%3Ccircle%20cx%3D%2732%27%20cy%3D%2732%27%20r%3D%2718%27%20fill%3D%27%2308140e%27%2F%3E%3Ctext%20x%3D%2732%27%20y%3D%2741%27%20text-anchor%3D%27middle%27%20font-family%3D%22Georgia%2C%27Times%20New%20Roman%27%2Cserif%22%20font-weight%3D%27700%27%20font-size%3D%2730%27%20fill%3D%27%23ff8a80%27%3E7%3C%2Ftext%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="casino.css">
<style>
.cab{max-width:760px;margin:0 auto;background:linear-gradient(180deg,#c7ccd2,#7d858e 42%,#4a5058);border-radius:26px;padding:16px;box-shadow:0 22px 44px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.7), inset 0 -3px 0 rgba(0,0,0,.4)}
.marquee{background:linear-gradient(180deg,#c9241f,#7d0f0c);border:3px solid #f0d98a;border-radius:16px;padding:10px;text-align:center;box-shadow:0 6px 14px rgba(0,0,0,.4)}
.marquee h2{margin:0;font:600 clamp(20px,3.6vw,34px)/1 Oswald,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#ffe9a8;text-shadow:0 0 14px rgba(255,200,90,.7)}
.marquee small{display:block;font:600 10px Oswald,sans-serif;letter-spacing:.34em;color:#ffd0b0;margin-top:4px;text-transform:uppercase}
.window{margin:14px 0 10px;background:linear-gradient(180deg,#1b1f24,#0d1013);border:4px solid #f0d98a;border-radius:14px;padding:10px;position:relative}
.preels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.preel{position:relative;overflow:hidden;height:var(--cell);border-radius:10px;background:linear-gradient(180deg,#fdfbf4,#d9d3c4);box-shadow:inset 0 10px 14px rgba(0,0,0,.25), inset 0 -10px 14px rgba(0,0,0,.25)}
.preel .col{position:absolute;left:0;right:0;top:0;will-change:transform}
.psym{height:var(--cell);display:grid;place-items:center;color:#1a1a1a;font:700 calc(var(--cell)*.3)/1 Oswald,sans-serif;letter-spacing:.04em;border-bottom:1px solid rgba(0,0,0,.08)}
.p-seven{color:#c9241f;font-size:calc(var(--cell)*.52);font-family:Cinzel,serif}
.p-bell{color:#c8901a}
.p-cherry{color:#c9241f}
.p-ball{color:#6c7b87}
.p-blank{color:rgba(0,0,0,.12);font-size:calc(var(--cell)*.2)}
.bar{display:block;width:62%;height:9%;margin:5% auto;background:#1a1a1a;border-radius:2px}
.payline{position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(201,36,31,.65);pointer-events:none}
.pbelow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.credit{background:#0d1013;border:2px solid #f0d98a;border-radius:10px;padding:6px 12px;color:#ffd970;font:600 18px Oswald,sans-serif;letter-spacing:.08em}
.ptable{margin-top:12px;background:#0d1013;border:2px solid #f0d98a;border-radius:12px;padding:10px 12px;color:#f3f1ea}
.ptable table{width:100%;border-collapse:collapse;font-size:13px}
.ptable td{padding:3px 2px;border-bottom:1px solid rgba(255,255,255,.08)}
.ptable td.num{text-align:right;color:#ffd970;font-weight:700}
.overlay{position:absolute;inset:0;background:rgba(8,10,13,.95);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;z-index:8;padding:10px}
.overlay[hidden]{display:none}
.pegboard{position:relative;width:min(100%,420px);aspect-ratio:1/0.9;background:linear-gradient(180deg,#10202c,#07121a);border:2px solid #f0d98a;border-radius:10px;overflow:hidden}
.peg{position:absolute;width:6px;height:6px;border-radius:50%;background:#cfd8e0;box-shadow:0 0 4px rgba(255,255,255,.4)}
.ball{position:absolute;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#98a6b3 60%,#5a6772);box-shadow:0 0 8px rgba(255,255,255,.5);transition:left .18s linear, top .18s linear}
.slots{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(9,1fr);gap:2px;padding:2px}
.slots div{background:rgba(255,215,112,.15);border:1px solid rgba(240,217,138,.5);border-radius:4px;text-align:center;font:700 10px Inter;color:#ffd970;padding:3px 0}
.slots div.hit{background:#ffd970;color:#2a1a05}
.window{--cell:118px}
@media (max-width:640px){
  .window{--cell:78px}
  .cab{padding:10px;border-radius:18px}
  .slots div{font-size:8px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Pinball <span>Classic</span></h1>
    <div id="nav"></div>
    <button class="ghost" id="reset">Reset bankroll</button>
  </header>

  <div class="statusbar">
    <div class="status">
      <div class="big" id="headline">Drop a coin and pull</div>
      <div class="sub" id="subline">Three reels, one line, and a pinball drop when three silver balls land</div>
      <div class="events" id="events"></div>
    </div>
  </div>

  <div class="cab">
    <div class="marquee"><h2>Pinball</h2><small>Three reel &middot; one line &middot; bonus drop</small></div>
    <div class="window" id="window">
      <div class="preels" id="reels"></div>
      <div class="payline"></div>
      <div class="overlay" id="overlay" hidden></div>
    </div>
    <div class="pbelow">
      <span class="credit" id="credit">BET $1</span>
      <span class="credit" id="lastwin">WIN $0</span>
    </div>
    <div class="ptable" id="ptable"></div>
  </div>
  <p class="hint">Chips set the bet. Space or Enter pulls the handle. B resets your bankroll.</p>
</div>

<div class="dock">
  <div class="wrap">
    <div class="chips" id="chips"></div>
    <div class="tools">
      <button class="tool" id="maxbet">Max bet</button>
      <button class="tool" id="auto">Auto: Off</button>
      <button class="tool" id="sound">Audio: All</button>
    </div>
    <div class="dockstats">
      <button class="stat bankbtn" id="bankBtn" type="button" title="Reset bankroll (B)"><small>Bankroll <i class="rs">&#8635;</i></small><b id="bank">$0</b></button>
      <div class="stat"><small>Bet</small><b id="totalbet">$0</b></div>
    </div>
    <button class="go-btn" id="spin">PULL</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<dialog id="resetDlg" class="dlg">
  <form id="resetForm" method="dialog">
    <h2>Reset bankroll</h2>
    <label for="resetAmt">Starting amount</label>
    <div class="amt"><span>$</span><input id="resetAmt" inputmode="decimal" autocomplete="off" value="1,000"></div>
    <div class="presets" id="resetPresets">
      <button type="button" data-amt="100">$100</button>
      <button type="button" data-amt="500">$500</button>
      <button type="button" data-amt="1000">$1,000</button>
      <button type="button" data-amt="5000">$5,000</button>
      <button type="button" data-amt="10000">$10,000</button>
      <button type="button" data-amt="100000">$100,000</button>
    </div>
    <p class="err" id="resetErr"></p>
    <p class="note">Shared with every table.</p>
    <div class="dlg-actions">
      <button type="button" class="tool" id="resetCancel">Cancel</button>
      <button type="submit" class="go">Reset</button>
    </div>
  </form>
</dialog>

<script src="sounds.js"></script>
<script src="common.js"></script>
<script src="slots.js"></script>
<script src="games.js"></script>
<script src="pinball.js"></script>
</body>
</html>
