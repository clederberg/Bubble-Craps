<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bubble Craps · Golden Lanterns</title>
<meta name="description" content="Free-play five-reel slot with hold and spin jackpots and free games.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Cdefs%3E%3ClinearGradient%20id%3D%27g%27%20x1%3D%270%27%20y1%3D%270%27%20x2%3D%270%27%20y2%3D%271%27%3E%3Cstop%20offset%3D%270%27%20stop-color%3D%27%23fbe9a6%27%2F%3E%3Cstop%20offset%3D%271%27%20stop-color%3D%27%23c9962b%27%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Ccircle%20cx%3D%2732%27%20cy%3D%2732%27%20r%3D%2730%27%20fill%3D%27%230b1f17%27%20stroke%3D%27url%28%23g%29%27%20stroke-width%3D%274%27%2F%3E%3Ccircle%20cx%3D%2732%27%20cy%3D%2732%27%20r%3D%2723%27%20fill%3D%27none%27%20stroke%3D%27url%28%23g%29%27%20stroke-width%3D%275%27%20stroke-dasharray%3D%277%207%27%2F%3E%3Ccircle%20cx%3D%2732%27%20cy%3D%2732%27%20r%3D%2718%27%20fill%3D%27%2308140e%27%2F%3E%3Ctext%20x%3D%2732%27%20y%3D%2740%27%20text-anchor%3D%27middle%27%20font-family%3D%22%27Noto%20Serif%20SC%27%2CGeorgia%2Cserif%22%20font-weight%3D%27700%27%20font-size%3D%2724%27%20fill%3D%27%23ffd970%27%3E%26%2337329%3B%3C%2Ftext%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="casino.css">
<style>
.cabinet{background:linear-gradient(180deg,#5b1016,#2a0709);border:1px solid rgba(242,199,92,.5);border-radius:22px;padding:14px;box-shadow:0 20px 40px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.12)}
.jackpots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.jp{position:relative;border-radius:12px;padding:8px 6px;text-align:center;border:1px solid rgba(242,199,92,.45);background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,.25))}
.jp b{display:block;font:600 11px Oswald,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#f7e3a8}
.jp span{display:block;font:600 clamp(14px,2.2vw,22px)/1.2 Oswald,sans-serif;color:#fff;text-shadow:0 0 12px rgba(242,199,92,.5)}
.jp.grand{border-color:#ffd970;background:linear-gradient(180deg,rgba(150,30,25,.85),rgba(60,10,8,.85))}
.jp.grand span{color:#ffe7a6}
.machine{position:relative;background:radial-gradient(120% 90% at 50% 0%, #17603f, #0c3b26);border-radius:16px;padding:10px;border:1px solid rgba(242,199,92,.35)}
.reels{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;position:relative}
.reel{position:relative;overflow:hidden;height:calc(var(--cell) * 3);border-radius:10px;background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,.2));box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.reel .col{position:absolute;left:0;right:0;top:0;will-change:transform}
.sym{height:var(--cell);display:grid;place-items:center;font:700 calc(var(--cell)*.46)/1 "Noto Serif SC",Cinzel,serif;border-bottom:1px solid rgba(0,0,0,.25);position:relative}
.sym i{position:absolute;inset:6%;border-radius:10px;opacity:.9}
.sym span{position:relative;z-index:1;text-shadow:0 2px 3px rgba(0,0,0,.5)}
.s-dragon i{background:linear-gradient(180deg,#7d1d18,#3d0b08)}.s-dragon span{color:#ffd28a}
.s-phoenix i{background:linear-gradient(180deg,#8a4a12,#3d1f05)}.s-phoenix span{color:#ffd9a0}
.s-koi i{background:linear-gradient(180deg,#1d5f7d,#08303d)}.s-koi span{color:#bfe8ff}
.s-lantern i{background:linear-gradient(180deg,#8a1436,#3d0817)}.s-lantern span{color:#ffc8d6}
.s-a i,.s-k i,.s-q i,.s-j i,.s-t i{background:linear-gradient(180deg,rgba(20,45,32,.9),rgba(8,24,16,.9))}
.s-a span{color:#f2c75c}.s-k span{color:#e0e6ea}.s-q span{color:#c9b8ff}.s-j span{color:#9fe7c1}.s-t span{color:#9fd0e7}
.wild i{background:linear-gradient(180deg,#f2c75c,#a8761f)}.wild span{color:#2a1a05}
.coin i{background:radial-gradient(circle at 40% 35%,#ffe9a8,#c9962b 65%,#8a6412)}.coin span{color:#4a3208}
.scat i{background:linear-gradient(180deg,#2f8a4f,#12461f)}.scat span{color:#eafff1}
.sym.win{animation:symwin .7s ease-in-out 3}
@keyframes symwin{50%{transform:scale(1.08);filter:brightness(1.5)}}
.sym.dim{opacity:.45}
.overlay{position:absolute;inset:0;background:rgba(6,18,12,.92);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:8;text-align:center;padding:14px}
.overlay[hidden]{display:none}
.overlay h3{margin:0;font:600 clamp(20px,3.4vw,34px) Oswald,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.overlay p{margin:0;color:var(--ink-2);font-size:14px}
.hold-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%;max-width:520px}
.hold-cell{aspect-ratio:1;border-radius:10px;border:1px dashed rgba(255,248,230,.3);display:grid;place-items:center;font:700 13px Inter;color:#4a3208;background:rgba(0,0,0,.35)}
.hold-cell.on{border-style:solid;border-color:#f2c75c;background:radial-gradient(circle at 40% 35%,#ffe9a8,#c9962b 70%);animation:lockin .3s ease-out}
.hold-cell.jp{background:radial-gradient(circle at 40% 35%,#fff,#e0532a 70%);color:#fff;font-size:11px;letter-spacing:.06em}
@keyframes lockin{from{transform:scale(1.35);opacity:.2}}
.respins{font:600 16px Oswald,sans-serif;letter-spacing:.18em;color:#fff;text-transform:uppercase}
.betbar{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:10px}
.lines{display:flex;gap:4px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:999px;padding:3px}
.lines button{border:0;background:none;color:var(--ink-2);font-weight:600;font-size:13px;padding:6px 12px;border-radius:999px;cursor:pointer}
.lines button[aria-selected=true]{background:var(--gold);color:var(--gold-ink)}
.winline{font:600 15px Oswald,sans-serif;letter-spacing:.06em;color:var(--gold);min-height:20px;text-align:center;margin-top:8px}
.paytable-dlg table{width:100%;border-collapse:collapse;font-size:13px}
.paytable-dlg td{padding:3px 4px;border-bottom:1px solid rgba(255,255,255,.08)}
.paytable-dlg td:first-child{font:700 16px "Noto Serif SC",serif}
.paytable-dlg td.num{text-align:right;color:var(--gold);font-weight:600}
.machine{--cell:76px}
@media (max-width:900px){.machine{--cell:58px}}
@media (max-width:640px){
  .machine{--cell:42px;padding:6px}
  .cabinet{padding:8px;border-radius:16px}
  .reels{gap:3px}
  .jackpots{gap:4px}
  .jp b{font-size:8px;letter-spacing:.12em}
  .jp span{font-size:13px}
  .hold-cell{font-size:11px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Golden <span>Lanterns</span></h1>
    <div id="nav"></div>
    <button class="ghost" id="reset">Reset bankroll</button>
  </header>

  <div class="statusbar">
    <div class="status">
      <div class="big" id="headline">Pick your lines and spin</div>
      <div class="sub" id="subline">Five reels · hold &amp; spin on six coins · free games on three temples</div>
      <div class="events" id="events"></div>
    </div>
  </div>

  <div class="cabinet">
    <div class="jackpots" id="jackpots"></div>
    <div class="machine" id="machine">
      <div class="reels" id="reels"></div>
      <div class="overlay" id="overlay" hidden></div>
    </div>
    <div class="winline" id="winline"></div>
    <div class="betbar">
      <div class="lines" id="lines"></div>
      <button class="tool" id="paytableBtn">Paytable</button>
    </div>
  </div>
  <p class="hint">Chips set the bet per line. Space or Enter spins. B resets your bankroll.</p>
</div>

<div class="dock">
  <div class="wrap">
    <div class="chips" id="chips"></div>
    <div class="tools">
      <button class="tool" id="maxbet">Max bet</button>
      <button class="tool" id="auto">Auto: Off</button>
      <button class="tool" id="sound">Audio: All</button>
    </div>
    <div class="dockstats">
      <button class="stat bankbtn" id="bankBtn" type="button" title="Reset bankroll (B)"><small>Bankroll <i class="rs">&#8635;</i></small><b id="bank">$0</b></button>
      <div class="stat"><small>Total bet</small><b id="totalbet">$0</b></div>
    </div>
    <button class="go-btn" id="spin">SPIN</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<dialog id="payDlg" class="dlg paytable-dlg" style="width:min(560px,calc(100% - 24px))">
  <h2>Golden Lanterns paytable</h2>
  <p class="note" id="payNote"></p>
  <div id="payBody" style="max-height:min(56vh,420px);overflow:auto"></div>
  <div class="dlg-actions"><button type="button" class="go" id="payClose">Close</button></div>
</dialog>

<dialog id="resetDlg" class="dlg">
  <form id="resetForm" method="dialog">
    <h2>Reset bankroll</h2>
    <label for="resetAmt">Starting amount</label>
    <div class="amt"><span>$</span><input id="resetAmt" inputmode="decimal" autocomplete="off" value="1,000"></div>
    <div class="presets" id="resetPresets">
      <button type="button" data-amt="100">$100</button>
      <button type="button" data-amt="500">$500</button>
      <button type="button" data-amt="1000">$1,000</button>
      <button type="button" data-amt="5000">$5,000</button>
      <button type="button" data-amt="10000">$10,000</button>
      <button type="button" data-amt="100000">$100,000</button>
    </div>
    <p class="err" id="resetErr"></p>
    <p class="note">Shared with every table.</p>
    <div class="dlg-actions">
      <button type="button" class="tool" id="resetCancel">Cancel</button>
      <button type="submit" class="go">Reset</button>
    </div>
  </form>
</dialog>

<script src="sounds.js"></script>
<script src="common.js"></script>
<script src="slots.js"></script>
<script src="games.js"></script>
<script src="lanterns.js"></script>
</body>
</html>
