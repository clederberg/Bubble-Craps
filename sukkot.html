<style>
/* ---------------------------------------------------------------- cabinet */
body.sk{background:radial-gradient(1200px 640px at 50% -18%, #22365a 0%, #070c16 62%) fixed, #070c16}
.sk{--night:#111c2e;--deep:#0a1220;--sky:#1b2d4a;--gold:#f0c460;--gold-2:#b8832c;
  --palm:#3f7d4a;--palm-2:#275632;--citron:#dbe04f;--cream:#fff3dc;--cell:#0e1829;--wood:#b9793f}
.cabinet{position:relative;max-width:940px;margin:0 auto;border-radius:26px;padding:14px 14px 16px;
  background:
    radial-gradient(120% 70% at 50% -10%, rgba(255,214,150,.2), transparent 60%),
    linear-gradient(180deg,#27406a,#111c2e 46%,#070d18);
  border:1px solid rgba(240,196,96,.42);
  box-shadow:0 26px 54px rgba(0,0,0,.66), inset 0 1px 0 rgba(255,235,200,.2), inset 0 -18px 40px rgba(0,0,0,.4)}

/* the stars you are meant to be able to see through the roof */
.cabinet::before{content:'';position:absolute;inset:0;border-radius:26px;pointer-events:none;opacity:.5;
  background-image:radial-gradient(1.4px 1.4px at 12% 14%, #fff 50%, transparent 52%),
    radial-gradient(1.2px 1.2px at 78% 9%, #ffeec0 50%, transparent 52%),
    radial-gradient(1.6px 1.6px at 45% 6%, #fff 50%, transparent 52%),
    radial-gradient(1.2px 1.2px at 88% 22%, #fff 50%, transparent 52%),
    radial-gradient(1.1px 1.1px at 24% 5%, #cfe3ff 50%, transparent 52%)}

.topbar{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin:0 0 10px}
.wordmark{font:700 clamp(19px,2.6vw,30px)/1 Cinzel,serif;letter-spacing:.16em;color:var(--gold);
  text-shadow:0 2px 0 rgba(0,0,0,.5), 0 0 22px rgba(240,196,96,.3)}
.wordmark i{font-style:normal;color:var(--citron)}
.ways{font:600 10px Oswald,sans-serif;letter-spacing:.24em;text-transform:uppercase;
  color:rgba(255,243,220,.6);border:1px solid rgba(240,196,96,.35);border-radius:99px;padding:4px 11px}

/* ---- the jackpot ladder ---- */
.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 12px}
.meter{position:relative;border-radius:12px;padding:7px 6px 8px;text-align:center;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,243,220,.1),rgba(0,0,0,.34));
  border:1px solid rgba(240,196,96,.3)}
.meter small{display:block;font:600 9px Oswald,sans-serif;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(255,243,220,.65)}
.meter b{display:block;font:700 clamp(13px,1.7vw,19px) Inter,sans-serif;color:var(--cream)}
.meter.m-chai{border-color:rgba(122,182,255,.45)} .meter.m-chai b{color:#a9d2ff}
.meter.m-simcha{border-color:rgba(111,214,140,.45)} .meter.m-simcha b{color:#8ff0b0}
.meter.m-hoshana{border-color:rgba(219,224,79,.5)} .meter.m-hoshana b{color:var(--citron)}
.meter.m-shalom{border-color:rgba(240,196,96,.7)} .meter.m-shalom b{color:#ffe3ac}
.meter.lit{animation:mflash 1.1s ease-out 3}
@keyframes mflash{0%,100%{box-shadow:none}50%{box-shadow:0 0 0 2px var(--gold),0 0 26px rgba(240,196,96,.7)}}

/* ---- reels ---- */
.glass{position:relative;border-radius:18px;padding:10px;
  background:linear-gradient(180deg,#16253d,#0a1220);
  border:1px solid rgba(240,196,96,.28);box-shadow:inset 0 2px 26px rgba(0,0,0,.6)}
.reels{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.reel{position:relative;overflow:hidden;border-radius:12px;background:var(--cell);
  box-shadow:inset 0 0 0 1px rgba(255,243,220,.07)}
.strip{display:flex;flex-direction:column;gap:6px;padding:6px;will-change:transform}
.cell{position:relative;aspect-ratio:1/.92;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(180deg,rgba(255,243,220,.07),rgba(0,0,0,.26));
  box-shadow:inset 0 0 0 1px rgba(255,243,220,.07)}
.cell svg{width:76%;height:76%;display:block}
.cell.win{background:linear-gradient(180deg,rgba(240,196,96,.3),rgba(240,196,96,.1));
  box-shadow:inset 0 0 0 2px var(--gold),0 0 18px rgba(240,196,96,.4)}
.cell.feat{box-shadow:inset 0 0 0 2px var(--citron),0 0 20px rgba(219,224,79,.45)}
.cell.gold{box-shadow:inset 0 0 0 2px #ffd970,0 0 26px rgba(255,217,112,.7)}
.blur .strip{filter:url(#vblur)}

/* the wheel sits behind the glass, the way it does on the real cabinet */
.behind{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;overflow:hidden;
  border-radius:18px;opacity:.26}
.behind svg{width:72%;max-width:460px}
.glass.lift .reels{opacity:.12;transition:opacity .5s}
.glass.lift .behind{opacity:1;transition:opacity .5s}

.status{display:flex;align-items:center;justify-content:center;gap:10px;min-height:30px;margin:10px 0 0;
  font:600 13px Inter,sans-serif;color:var(--cream);text-align:center}
.status .hit{color:var(--citron)}

/* ---- the night board ---- */
.board{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:14px;
  background:radial-gradient(900px 520px at 50% 18%, rgba(40,66,110,.6), rgba(4,7,13,.93));
  backdrop-filter:blur(3px)}
.boardin{width:min(880px,96vw);border-radius:20px;padding:16px;
  background:linear-gradient(180deg,#1b2d4a,#0a1220);border:1px solid rgba(240,196,96,.5);
  box-shadow:0 30px 80px rgba(0,0,0,.7)}
.boardin h2{margin:0;text-align:center;font:700 clamp(17px,2.4vw,26px) Cinzel,serif;
  letter-spacing:.12em;color:var(--gold)}
.boardin p.sub{margin:4px 0 12px;text-align:center;font:600 11px Oswald,sans-serif;
  letter-spacing:.2em;text-transform:uppercase;color:rgba(255,243,220,.62)}
.street{display:grid;gap:7px;margin:0 auto}
.plot{position:relative;aspect-ratio:1;border-radius:10px;background:rgba(0,0,0,.34);
  box-shadow:inset 0 0 0 1px rgba(255,243,220,.09);display:grid;place-items:center;overflow:hidden}
.plot svg{width:88%;height:88%}
.plot .val{position:absolute;inset:auto 0 0;padding:2px 0;font:700 12px Inter,sans-serif;
  text-align:center;color:#2a1205;background:linear-gradient(180deg,#ffe3ac,#e0a93c)}
.plot .val.jp{background:linear-gradient(180deg,#fff0c4,#f0c460);font-size:10px;letter-spacing:.06em}
.plot.up{animation:pop .4s cubic-bezier(.2,1.7,.4,1)}
@keyframes pop{0%{transform:scale(.82)}100%{transform:scale(1)}}
.plot.paid{box-shadow:inset 0 0 0 2px var(--gold)}
.nights{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px 0 0;
  font:600 11px Oswald,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,243,220,.65)}
.nights b{color:var(--citron);font-size:15px}
.tally{margin:10px 0 0;text-align:center;font:700 clamp(18px,3vw,30px) Inter,sans-serif;color:#ffe3ac}

/* ---- the wheel overlay ---- */
.wheelwrap{display:grid;place-items:center;margin:4px 0 0}
.wheelwrap svg{width:min(560px,86vw);height:auto;filter:drop-shadow(0 16px 34px rgba(0,0,0,.6))}
.wheel-face{transition:transform 4.6s cubic-bezier(.12,.72,.12,1)}
.pair .wheel-face.b{transition-duration:5.2s}

.hint{text-align:center;margin:10px 0 0;font:500 12px Inter,sans-serif;color:rgba(255,243,220,.55)}
.go-btn.sk-go{background:linear-gradient(180deg,#ffe9b0,#d9a63a)}

@media (max-width:620px){
  .meters{grid-template-columns:repeat(2,1fr)}
  .reels{gap:4px}.strip{gap:4px;padding:4px}
}
/* On a table terminal the page has more room than it needs, so the cabinet
   takes it rather than floating in the middle of a field of background. */
html.framed body>.wrap{max-width:1180px}
html.framed .hint{display:none}
</style>
</head>

<div class="wrap sk">
  <header>
    <h1>Bubble <span>Sukkah</span></h1>
    <div id="nav"></div>
    <button class="ghost" id="reset">Reset bankroll</button>
  </header>

  <div class="cabinet">
    <div class="topbar">
      <div class="wordmark">SUKKAH <i>NIGHTS</i></div>
      <div class="ways">243 ways</div>
    </div>

    <div class="meters" id="meters"></div>

    <div class="glass" id="glass">
      <div class="behind" id="behind"></div>
      <div class="reels" id="reels"></div>
    </div>

    <div class="status" id="status">Six lulavim build a street. Three etrogim spin the wheel.</div>
  </div>

  <p class="hint">Space spins. The pitom etrog, the one with its crown tip unbroken, opens the second wheel and the sukkah to six rows.</p>
  <details class="rules" id="rules"></details>
</div>

<div class="dock">
  <div class="wrap">
    <div class="chips" id="chips"></div>
    <div class="tools">
      <button class="tool" id="sound">Audio: All</button>
    </div>
    <div class="dockstats">
      <button class="stat bankbtn" id="bankBtn" type="button" title="Reset bankroll (B)"><small>Bankroll <i class="rs">&#8635;</i></small><b id="bank">$0</b></button>
      <div class="stat"><small>Total bet</small><b id="bet">$0</b></div>
      <div class="stat"><small>Last win</small><b id="win">$0</b></div>
    </div>
    <button class="go-btn sk-go" id="spin">SPIN</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<dialog id="resetDlg" class="dlg">
  <form id="resetForm" method="dialog">
    <h2>Reset bankroll</h2>
    <label for="resetAmt">Starting amount</label>
    <div class="amt"><span>$</span><input id="resetAmt" inputmode="decimal" autocomplete="off" value="1,000"></div>
    <div class="presets" id="resetPresets">
      <button type="button" data-amt="100">$100</button>
      <button type="button" data-amt="500">$500</button>
      <button type="button" data-amt="1000">$1,000</button>
      <button type="button" data-amt="5000">$5,000</button>
      <button type="button" data-amt="10000">$10,000</button>
      <button type="button" data-amt="100000">$100,000</button>
    </div>
    <p class="err" id="resetErr"></p>
    <p class="note">Shared with every other table.</p>
    <div class="dlg-actions">
      <button type="button" class="tool" id="resetCancel">Cancel</button>
      <button type="submit" class="go">Reset</button>
    </div>
  </form>
</dialog>

<script src="common.js"></script>
<script src="sounds.js"></script>
<script src="slots.js"></script>
<script src="sukkah.js"></script>
<script src="sukkot.js"></script>

if ('serviceWorker' in navigator) {

    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
</script>
