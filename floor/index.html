<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bubble Craps &middot; The Floor</title>
<meta name="description" content="Walk the Bubble Craps casino floor in first person.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27%232a0a16%27%2F%3E%3Ctext%20x%3D%2732%27%20y%3D%2742%27%20text-anchor%3D%27middle%27%20font-size%3D%2726%27%20font-family%3D%27serif%27%20fill%3D%27%23f0c460%27%3ECML%3C%2Ftext%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="floor.css">
</head>
<body>
<canvas id="view"></canvas>

<div id="loader">
  <div class="monogram">CML</div>
  <h1>Bubble Craps</h1>
  <p class="tag">The Floor</p>
  <div class="track"><i id="loadBar"></i></div>
  <p id="loadText">Opening the doors</p>
</div>

<div id="hud" class="hidden">
  <div class="crosshair"></div>
  <div class="prompt" id="prompt"></div>
  <div class="keys">
    <b>W A S D</b> or <b>arrows</b> walk <span>&middot;</span> <b>mouse</b> look <span>&middot;</span> <b>shift</b> hurry
    <span>&middot;</span> <b>click</b> a game to play <span>&middot;</span> <b>F</b> fly
  </div>
  <div class="seated" id="seated">
    <b id="seatedName">Craps</b>
    <button id="leave">Leave the table <i>Q</i></button>
  </div>
  <div class="corner"><a href="../index.html">Back to the tables</a> <i id="fps"></i></div>
  <div class="click-note" id="clickNote">Click to look around</div>
</div>

<div id="panel" class="panel">
  <div class="panel-bar">
    <span class="dot"></span>
    <b id="panelName">Craps</b>
    <button id="panelClose">Leave the table <i>Q</i></button>
  </div>
  <div class="panel-view"><iframe id="panelFrame" title="game" allow="autoplay"></iframe></div>
</div>

<script type="module" src="floor.bundle.js"></script>
</body>
</html>
